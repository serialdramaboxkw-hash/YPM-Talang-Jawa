name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -type f | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix dependencies
        run: |
          cd "$PROJECT_DIR"
          sed -i 's/geocoding: \^3\.0\.1/geocoding: ^4.0.0/' pubspec.yaml
          sed -i 's/geolocator: \^13\.0\.1/geolocator: ^14.0.3/' pubspec.yaml
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YPM-Talang-Jawa-APK
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          if-no-files-found: error
